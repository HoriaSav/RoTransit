spring:
  datasource:
    url: jdbc:h2:mem:rotransit_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

rotransit:
  routes:
    search:
      max-slices: 12
      window-first-enabled: false
