spring:
  application:
    name: rotransit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rotransit}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:rotransit_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8085}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
