services:
  db:
    image: postgres:16
    container_name: rotransit-postgres
    restart: unless-stopped
    env_file:
      - ./db/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - rotransit_postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  otp:
    build:
      context: ./otp
      dockerfile: Dockerfile
    container_name: otp
    restart: unless-stopped
    volumes:
      - ./otp:/var/opentripplanner
    environment:
      JAVA_OPTS: "-Xmx4G"
    command: --build --serve
    ports:
      - "8080:8080"

  gtfs-import:
    build:
      context: ./scripts/db
      dockerfile: Dockerfile.gtfs-import
    container_name: rotransit-gtfs-import
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://admin:rotransit_password@db:5432/rotransit
      GTFS_IMPORT_IF_EMPTY: "1"
    volumes:
      - ./otp/gtfs:/gtfs:ro
    command:
      - "--gtfs"
      - "/gtfs/ro-ratbv.zip"
      - "--city-name"
      - "Brasov"
      - "--country"
      - "Romania"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rotransit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      otp:
        condition: service_started
      gtfs-import:
        condition: service_completed_successfully
    environment:
      PORT: "8085"
      DB_URL: "jdbc:postgresql://db:5432/rotransit"
      DB_USER: "admin"
      DB_PASSWORD: "rotransit_password"
    ports:
      - "8085:8085"

volumes:
  rotransit_postgres_data: