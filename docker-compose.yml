services:
  db:
    image: postgres:16
    container_name: rotransit-postgres
    restart: unless-stopped
    env_file:
      - ./db/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - rotransit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend_v2
      dockerfile: Dockerfile
    container_name: rotransit-backend
    restart: unless-stopped
    # SPRING_DATASOURCE_PASSWORD and SPRING_SECURITY_PASSWORD ({bcrypt}...).
    # format: raw passes values literally, so the {bcrypt}$2a$... hash keeps its $ characters
    # and the same unquoted .env also works in IntelliJ.
    env_file:
      - path: ./backend_v2/.env
        format: raw
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/rotransit?currentSchema=feeds"
    ports:
      - "8080:8080"
    volumes:
      - rotransit_feeds:/app/feeds
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rotransit-cloudflared
    restart: unless-stopped
    # Token tunnel: TUNNEL_TOKEN comes from cloudflare/.env (not compose ${} interpolation).
    # In the Cloudflare dashboard the public hostname must point at http://app:8080.
    command: tunnel --no-autoupdate run
    env_file:
      # Optional so `docker compose up db app` works on machines without a tunnel token.
      - path: ./cloudflare/.env
        required: false
    depends_on:
      app:
        condition: service_started

volumes:
  rotransit_postgres_data:
  rotransit_feeds:
