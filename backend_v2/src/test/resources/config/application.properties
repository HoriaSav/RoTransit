# Test-only overrides. classpath:/config/application.properties takes precedence over the main
# classpath:/application.properties, and src/test/resources is never packaged into the app.
# The admin password must not depend on SPRING_SECURITY_PASSWORD from the developer's environment:
# without it the main ${SPRING_SECURITY_PASSWORD} placeholder fails context startup, and with it the
# tests would be coupled to the real password.
spring.security.user.password=rt-test-only-admin-pw
