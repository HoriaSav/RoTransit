name: rotransit_frontend
description: RoTransit mobile app for route search and saved journeys.
publish_to: "none"
version: 0.1.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  maplibre_gl: ^0.25.0
  geolocator: ^13.0.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^10.1.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "rotransit_launcher"
  ios: true
  image_path: assets/launcher_icon.png
  adaptive_icon_background: "#1C2D49"
  adaptive_icon_foreground: assets/adaptive_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/icons/bus_noBG.png
    - assets/icons/cardinal-point.png
    - assets/operators/ratBv_noBg.png
    - assets/operators/ratBv.png
