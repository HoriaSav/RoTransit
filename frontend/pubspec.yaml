name: rotransit
description: RoTransit companion app for Brașov bus stops and timetables.
publish_to: "none"
version: 0.1.0+9

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  package_info_plus: ^8.1.0
  geolocator: ^13.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^10.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.4+4

# Flutter 3.27 pins path 1.9.0 via flutter_test; tile caching wants ^1.9.1.
dependency_overrides:
  path: 1.9.0

flutter_launcher_icons:
  android: "rotransit_launcher"
  ios: true
  image_path: assets/launcher_icon.png
  adaptive_icon_background: "#1C2D49"
  adaptive_icon_foreground: assets/adaptive_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 23 # same as android/app/build.gradle.kts minSdk

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/icons/bus_noBG.png
    - assets/icons/cardinal-point.png
    - assets/operators/ratBv_noBg.png
    - assets/operators/ratBv.png
    - assets/data/brasov_companion.sqlite.gz
    - assets/data/brasov_companion.manifest.json
