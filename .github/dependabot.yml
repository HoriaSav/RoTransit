# Dependabot version updates.
# Note: GitHub only reads this file from the default branch (main).
version: 2
updates:
  # Maven dependencies and plugins of the Spring Boot backend
  - package-ecosystem: maven
    directory: "/backend_v2"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
